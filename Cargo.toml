[package]
name = "prometheus"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
description = "Query Prometheus-compatible APIs, including Thanos, from DuckDB"
readme = "README.md"
keywords = ["duckdb", "prometheus", "thanos", "analytics"]
categories = ["database"]
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "prometheus"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
duckdb = { version = "~1.10504.0", features = ["loadable-extension", "vscalar"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
url = "2.5.8"
