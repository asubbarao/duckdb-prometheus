[package]
name = "prometheus"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
description = "Query Prometheus-compatible APIs, including Thanos, from DuckDB"
readme = "README.md"
keywords = ["duckdb", "prometheus", "thanos", "analytics"]
categories = ["database"]
publish = false

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
duckdb = { version = "~1.10504.0", features = ["loadable-extension"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
url = "2.5.8"
